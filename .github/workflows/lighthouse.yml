name: Lighthouse

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Build only: deployment is done by Cloudflare Workers Builds on push to main, never from CI.
      - run: npm run build

      - run: npm run lighthouse

      # Uploaded even when a threshold fails, so the HTML reports show what to fix.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14
