name: Lighthouse

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Needs only node and the lockfile, so it runs before `npm ci` and turns npm's cryptic "Missing: ... from lock
      # file" into a message that says which entries are gone and how to restore them.
      - run: node scripts/check-lockfile.ts

      - run: npm ci

      # Build only: deployment is done by Cloudflare Workers Builds on push to main, never from CI.
      - run: npm run build

      - run: npm run lighthouse

      # Uploaded even when a threshold fails, so the HTML reports show what to fix.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          # The directory name starts with a dot, which upload-artifact@v4 skips unless told otherwise.
          include-hidden-files: true
          retention-days: 14
