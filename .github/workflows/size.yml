name: Bundle size

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Needs only node and the lockfile, so it runs before `npm ci` and turns npm's cryptic "Missing: ... from lock
      # file" into a message that says which entries are gone and how to restore them.
      - run: node scripts/check-lockfile.ts

      - run: npm ci

      # Build only: deployment is done by Cloudflare Workers Builds on push to main, never from CI.
      - run: npm run build

      # Reads the build output above; it does not rebuild.
      - run: npm run size
