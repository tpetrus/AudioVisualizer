name: CI

# Thin caller of the shared tpetrus/ci-workflows repo's node-ci.yml, which replaces this repo's former ci.yml,
# size.yml, lighthouse.yml and e2e.yml: one shared build job now feeds quality, size, lighthouse and e2e instead of
# each workflow building it again on its own, and "result" is the one required status check instead of several.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: tpetrus/ci-workflows/.github/workflows/node-ci.yml@v0.1.4
    with:
      build-dir: build/client
