name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# The suite is split across parallel jobs ("shards") automatically, so adding tests (or a visualizer, which adds a
# test to every spec that loops over them) never needs a workflow edit. The e2e-plan job counts the tests and picks the
# shard count from these two knobs:
#   TESTS_PER_SHARD  how many tests one shard should run. Each shard pays about 50 s of fixed cost (container start,
#                    npm ci, build, wrangler start-up), so smaller shards finish sooner but spend more runner minutes.
#                    Retune it only if tests get much cheaper or dearer.
#   MAX_SHARDS       an upper bound on the shard count. GitHub Free allows 20 concurrent jobs per account and the other
#                    PR workflows need some of them, so a huge suite must not starve those. Past the cap the shards
#                    simply get bigger, and the plan job prints a warning.
env:
  TESTS_PER_SHARD: 3
  MAX_SHARDS: 10

jobs:
  # Counts the tests and decides how many shards to run. `playwright test --list` only loads the spec files: it starts
  # no browser and no webServer and needs no build, so this job needs neither the container nor the build.
  e2e-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Needs only node and the lockfile. The shards wait for this job, so one check here guards all of them and
      # turns npm's cryptic "Missing: ... from lock file" into a message that says which entries are gone.
      - run: node scripts/check-lockfile.ts

      - run: npm ci

      - id: plan
        run: |
          npx playwright test --list --reporter=json > list.json
          node <<'JS'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('list.json', 'utf8'));
          // Each entry in a spec's `tests` is one test in one project, which is the unit --shard splits by.
          const count = (suite) =>
            (suite.specs ?? []).reduce((n, spec) => n + spec.tests.length, 0) +
            (suite.suites ?? []).reduce((n, child) => n + count(child), 0);
          const total = report.suites.reduce((n, suite) => n + count(suite), 0);
          // An empty plan would otherwise pass with zero shards and the required check would go green untested.
          if (report.errors.length > 0 || total === 0) {
            console.log('::error::Could not list the tests: ' + JSON.stringify(report.errors));
            process.exit(1);
          }
          const perShard = Number(process.env.TESTS_PER_SHARD);
          const max = Number(process.env.MAX_SHARDS);
          const wanted = Math.ceil(total / perShard);
          const shards = Math.min(Math.max(wanted, 1), max);
          if (wanted > max) {
            console.log(`::warning::${total} tests would need ${wanted} shards; capped at MAX_SHARDS=${max}.`);
          }
          console.log(`${total} tests -> ${shards} shards (TESTS_PER_SHARD=${perShard}, MAX_SHARDS=${max})`);
          const list = Array.from({ length: shards }, (_, i) => i + 1);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `shards=${JSON.stringify(list)}\n`);
          JS

  e2e:
    needs: e2e-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Let every shard finish so one failure doesn't hide others; e2e-result reports the overall outcome.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-plan.outputs.shards) }}
    # The official Playwright image ships the browsers and their OS libraries, and gives every run the same fonts and
    # rendering, which the visual-regression baselines in e2e/visual.spec.ts depend on. Keep the tag equal to the
    # installed @playwright/test version (and to update-snapshots.yml); Dependabot bumps of Playwright need it bumped too.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The tests serve build/client with `wrangler dev`. Build only: deployment is done by Cloudflare Workers
      # Builds on push to main, never from CI.
      # The build prerenders the SPA shell through a local Vite server. Inside the container "localhost" resolved to an
      # address that server was not listening on (ECONNREFUSED), so ask Node to prefer IPv4.
      - run: npm run build
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # The reporter is set here, not in playwright.config.ts, so local runs and update-snapshots.yml keep the HTML
      # report. Blob reports are what e2e-result merges into one report when something fails.
      - run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=blob,list

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 14

      # Includes the expected/actual/diff images of any failed visual comparison.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The one required status check. Its name never changes as the shard count does, so branch protection needs no
  # edit when tests are added. When everything passed it does almost nothing; only on failure does it merge the
  # shards' blob reports into one HTML report.
  e2e-result:
    needs: [e2e-plan, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A failed, cancelled or skipped needed job is not a pass, so require every result to be exactly "success".
      - id: verdict
        run: |
          echo "e2e-plan: $PLAN, e2e: $E2E"
          if [ "$PLAN" = success ] && [ "$E2E" = success ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          PLAN: ${{ needs.e2e-plan.result }}
          E2E: ${{ needs.e2e.result }}

      - if: steps.verdict.outputs.passed != 'true'
        uses: actions/checkout@v7

      - if: steps.verdict.outputs.passed != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.verdict.outputs.passed != 'true'
        run: npm ci

      - if: steps.verdict.outputs.passed != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - if: steps.verdict.outputs.passed != 'true'
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - if: steps.verdict.outputs.passed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - if: steps.verdict.outputs.passed != 'true'
        run: exit 1
