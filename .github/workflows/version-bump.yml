name: Version bump

# Thin caller of the shared tpetrus/ci-workflows repo's version-bump.yml, the version bot. It keeps package.json and
# package-lock.json at the version the PR title calls for, so nobody edits the version by hand (see "Versioning and
# releases" in AGENTS.md). It never pushes to main, because every push to main is a production deploy: it only pushes
# to PR branches.
#
# SECURITY. `pull_request_target` runs with secrets, so it must never run code from the PR. The reusable workflow
# only ever reads and edits the PR branch as text (git, jq, release-cli); no code from it is ever executed. Fork PRs
# are skipped, since the bot cannot push to them anyway.
on:
  # zizmor: ignore[dangerous-triggers] The reusable version-bump.yml only ever reads and edits the PR branch as data
  # through git and jq, never executes it, and no secret reaches code from the PR branch (see SECURITY above).
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version-bump:
    uses: tpetrus/ci-workflows/.github/workflows/version-bump.yml@c60f83bc1b43c9764123a6010cbd2c82c77218f8 # v0.1.2
    # Only the two secrets version-bump.yml actually declares, not every secret this repo has: `secrets: inherit`
    # over-grants every secret the caller has (a zizmor finding fixed upstream in ci-workflows' own
    # self-version-bump.yml), so this names them explicitly instead.
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    # One run per PR (or per push to main) at a time, so two quick events cannot push over each other. Nothing is
    # cancelled: a title edit arriving mid-run must still be handled afterwards. The reusable workflow declares no
    # concurrency of its own, so it is set here, on the one job that calls it; one group covers both triggers.
    concurrency:
      group: version-bump-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
