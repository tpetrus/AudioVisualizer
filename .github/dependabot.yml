version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR for routine dev-tooling bumps and one for routine runtime bumps; majors arrive as separate PRs.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # three.js is pinned at 0.141 by policy (AGENTS.md); upgrading is a deliberate project, not a bot PR.
      - dependency-name: three
      - dependency-name: '@types/three'
      # eslint-plugin-jsx-a11y does not support ESLint 10 yet, so skip major bumps until it does.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
