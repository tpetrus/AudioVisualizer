version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Titles become the PR title, which must be a Conventional Commit: "build(deps): ..." and "build(deps-dev): ...".
    commit-message:
      prefix: build
      include: scope
    # One PR for routine dev-tooling bumps and one for routine runtime bumps; majors arrive as separate PRs.
    groups:
      # react-router, @react-router/node and @react-router/dev share one version line and break if they drift,
      # so they update in a single PR (this group takes precedence over the generic ones below).
      react-router:
        patterns: ['react-router', '@react-router/*']
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # three.js is pinned at 0.141 by policy (AGENTS.md); upgrading is a deliberate project, not a bot PR.
      - dependency-name: three
      - dependency-name: '@types/three'
      # eslint-plugin-jsx-a11y does not support ESLint 10 yet, so skip major bumps until it does.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # @eslint/js must stay on the same major as eslint (9), so it is held back together with it.
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # typescript-eslint only supports TypeScript <6.1, so a TypeScript major breaks `npm ci` (ERESOLVE) until it catches up.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node must track the Node major in .nvmrc / engines (24), not the newest Node release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Same reason as above: "ci(deps): ...". Workflow-only changes release nothing.
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
