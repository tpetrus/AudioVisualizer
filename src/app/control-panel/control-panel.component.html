<div class="panel" [class.open]="!collapsed">
    <button class="toggle" (click)="collapsed = !collapsed">
        {{ collapsed ? '☰ Settings' : '✕ Close' }}
    </button>
    <div class="body" *ngIf="!collapsed">
        <details class="section" *ngFor="let section of sections" [open]="isOpen(section)"
            (toggle)="onToggle(section, $event)">
            <summary>
                {{ section.name }}
                <span class="modified" *ngIf="modifiedCount(section)" title="Settings changed from their defaults">
                    {{ modifiedCount(section) }} changed
                </span>
            </summary>
            <div class="control-row" *ngFor="let control of section.controls">
                <label [attr.for]="control.key">{{ control.label }}</label>
                <ng-container [ngSwitch]="control.type">
                    <input *ngSwitchCase="'range'" type="range" [id]="control.key" [min]="control.min"
                        [max]="control.max" [step]="control.step" [value]="control.value"
                        (input)="control.value = +asInput($event).value">
                    <input *ngSwitchCase="'checkbox'" type="checkbox" [id]="control.key" [checked]="!!control.value"
                        (change)="control.value = asInput($event).checked">
                    <input *ngSwitchCase="'color'" type="color" [id]="control.key" [value]="control.value"
                        (input)="control.value = asInput($event).value">
                </ng-container>
                <span class="value" *ngIf="control.type === 'range'">{{ control.value }}</span>
                <button class="field-reset" type="button" title="Reset to default"
                    [attr.aria-label]="'Reset ' + control.label + ' to default'"
                    [style.visibility]="isModified(control) ? 'visible' : 'hidden'"
                    (click)="resetControl(control)">↺</button>
            </div>
        </details>

        <div class="footer">
            <button class="reset" (click)="reset()">Reset all</button>
            <button class="reset" (click)="audioDialogOpen = true">Audio settings</button>
            <label class="stats-toggle"><input type="checkbox" [checked]="showStats" (change)="showStats = asInput($event).checked"> Show performance stats</label>
        </div>
    </div>
</div>

<app-perf-stats *ngIf="showStats"></app-perf-stats>

<app-audio-source-dialog *ngIf="audioDialogOpen" (closed)="audioDialogOpen = false"></app-audio-source-dialog>
